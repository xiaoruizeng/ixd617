<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolNode 跳转逻辑对比 Demo</title>
    <script type="text/javascript">
        // GitHub Pages SPA 重定向处理
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .mode-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #333;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .demo-area {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .tab-bar {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            overflow-x: auto;
            min-height: 50px;
        }

        .tab {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: #f8f9fa;
            border: none;
            border-right: 1px solid #e9ecef;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.2s ease;
            position: relative;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .tab.active {
            background: white;
            border-bottom: 2px solid #667eea;
        }

        .tab-close {
            margin-left: 8px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #dc3545;
            color: white;
            border: none;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-close:hover {
            background: #c82333;
        }

        .tab-content {
            padding: 30px;
            min-height: 500px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 14px;
        }

        .breadcrumb-item {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
        }

        .breadcrumb-item:hover {
            text-decoration: underline;
        }

        .breadcrumb-item.current {
            color: #333;
            font-weight: 500;
        }

        .breadcrumb-separator {
            color: #999;
        }

        .toolnode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .toolnode {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .toolnode:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
        }

        .toolnode-icon {
            width: 40px;
            height: 40px;
            background: #ffc107;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 4px rgba(255, 193, 7, 0.3);
        }

        .toolnode-content {
            flex: 1;
        }

        .toolnode h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.2rem;
            margin-top: 0;
        }

        .toolnode p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        .toolnode .level-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 12px;
        }

        .workflow-node {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .workflow-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .workflow-icon.input {
            background: #28a745;
        }

        .workflow-icon.process {
            background: #17a2b8;
        }

        .workflow-icon.output {
            background: #6f42c1;
        }

        .workflow-icon.tool {
            background: #ffc107;
        }

        .mode-description {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 4px 4px 0;
            position: relative;
        }

        .mode-description.mode1 {
            background: #e8f5e8;
            border-left-color: #4caf50;
        }

        .mode-description.mode2 {
            background: #fff3e0;
            border-left-color: #ff9800;
        }

        .mode-description h4 {
            color: #1976d2;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-description.mode1 h4 {
            color: #2e7d32;
        }

        .mode-description.mode2 h4 {
            color: #f57c00;
        }

        .mode-description p {
            color: #424242;
            font-size: 14px;
        }

        .mode-badge {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .mode-badge.recommended {
            background: #4caf50;
        }

        .mode-badge.alternative {
            background: #ff9800;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ToolNode 跳转逻辑对比 Demo</h1>
            <p>体验两种不同的工具节点导航模式</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="mode1">
                模式一：主流程新Tab + 嵌套Breadcrumb
            </button>
            <button class="mode-btn" data-mode="mode2">
                模式二：所有节点都新Tab (Flat)
            </button>
        </div>

        <div class="demo-area">
            <div class="tab-bar" id="tabBar">
                <div class="tab active" data-tab="main">
                    <span>主流程</span>
                </div>
            </div>

            <div class="tab-content" id="tabContent">
                <!-- 内容将通过 JavaScript 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        class ToolNodeDemo {
            constructor() {
                this.currentMode = 'mode1';
                this.tabs = [{ id: 'main', title: '主流程', content: 'main', breadcrumb: ['主流程'] }];
                this.activeTab = 'main';
                this.tabCounter = 1;
                
                this.init();
            }

            init() {
                this.bindEvents();
                this.renderContent();
            }

            bindEvents() {
                // 模式切换
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentMode = e.target.dataset.mode;
                        this.resetDemo();
                    });
                });

                // Tab 切换事件委托
                document.getElementById('tabBar').addEventListener('click', (e) => {
                    if (e.target.classList.contains('tab-close')) {
                        e.stopPropagation();
                        this.closeTab(e.target.closest('.tab').dataset.tab);
                    } else if (e.target.closest('.tab')) {
                        this.switchTab(e.target.closest('.tab').dataset.tab);
                    }
                });
            }

            resetDemo() {
                this.tabs = [{ id: 'main', title: '主流程', content: 'main', breadcrumb: ['主流程'] }];
                this.activeTab = 'main';
                this.tabCounter = 1;
                this.renderTabs();
                this.renderContent();
            }

            createTab(id, title, content, breadcrumb = []) {
                const tab = {
                    id,
                    title,
                    content,
                    breadcrumb: [...breadcrumb]
                };
                this.tabs.push(tab);
                this.activeTab = id;
                this.renderTabs();
                this.renderContent();
            }

            closeTab(tabId) {
                if (tabId === 'main') return; // 不能关闭主流程tab
                
                this.tabs = this.tabs.filter(tab => tab.id !== tabId);
                
                if (this.activeTab === tabId) {
                    this.activeTab = this.tabs[this.tabs.length - 1].id;
                }
                
                this.renderTabs();
                this.renderContent();
            }

            switchTab(tabId) {
                this.activeTab = tabId;
                this.renderTabs();
                this.renderContent();
            }

            navigateInCurrentTab(content, breadcrumb) {
                const currentTab = this.tabs.find(tab => tab.id === this.activeTab);
                if (currentTab) {
                    currentTab.content = content;
                    currentTab.breadcrumb = [...breadcrumb];
                    this.renderContent();
                }
            }

            handleToolNodeClick(nodeId, nodeTitle, level) {
                if (this.currentMode === 'mode1') {
                    // 模式一：主流程节点开新tab，嵌套节点用breadcrumb
                    if (level === 1) {
                        // 主流程节点，开新tab
                        const newTabId = `tab_${this.tabCounter++}`;
                        this.createTab(newTabId, nodeTitle, nodeId, [nodeTitle]);
                    } else {
                        // 嵌套节点，在当前tab内导航
                        const currentTab = this.tabs.find(tab => tab.id === this.activeTab);
                        const newBreadcrumb = [...currentTab.breadcrumb, nodeTitle];
                        this.navigateInCurrentTab(nodeId, newBreadcrumb);
                    }
                } else {
                    // 模式二：所有节点都开新tab
                    const newTabId = `tab_${this.tabCounter++}`;
                    this.createTab(newTabId, nodeTitle, nodeId, [nodeTitle]);
                }
            }

            handleBreadcrumbClick(index) {
                const currentTab = this.tabs.find(tab => tab.id === this.activeTab);
                if (currentTab && index < currentTab.breadcrumb.length - 1) {
                    const newBreadcrumb = currentTab.breadcrumb.slice(0, index + 1);
                    const targetContent = this.getBreadcrumbContent(newBreadcrumb);
                    this.navigateInCurrentTab(targetContent, newBreadcrumb);
                }
            }

            getBreadcrumbContent(breadcrumb) {
                if (breadcrumb.length === 1) {
                    return breadcrumb[0].toLowerCase().replace(/\s+/g, '_');
                }
                return breadcrumb[breadcrumb.length - 1].toLowerCase().replace(/\s+/g, '_');
            }

            renderTabs() {
                const tabBar = document.getElementById('tabBar');
                tabBar.innerHTML = this.tabs.map(tab => `
                    <div class="tab ${tab.id === this.activeTab ? 'active' : ''}" data-tab="${tab.id}">
                        <span>${tab.title}</span>
                        ${tab.id !== 'main' ? '<button class="tab-close">×</button>' : ''}
                    </div>
                `).join('');
            }

            renderContent() {
                const activeTab = this.tabs.find(tab => tab.id === this.activeTab);
                if (!activeTab) return;

                const content = this.getContentByType(activeTab.content);
                const showBreadcrumb = this.currentMode === 'mode1' && activeTab.breadcrumb.length > 1;
                
                document.getElementById('tabContent').innerHTML = `
                    ${this.getModeDescription()}
                    ${showBreadcrumb ? this.renderBreadcrumb(activeTab.breadcrumb) : ''}
                    ${content}
                `;
            }

            getModeDescription() {
                const descriptions = {
                    mode1: {
                        title: '模式一：主流程新Tab + 嵌套Breadcrumb',
                        desc: '主流程中的ToolNode点击后开新tab，但内部的子节点只在当前tab内用breadcrumb切换，减少tab数量，保持层次清晰',
                        badge: 'recommended',
                        badgeText: '推荐'
                    },
                    mode2: {
                        title: '模式二：所有节点都新Tab（Flat结构）',
                        desc: '无论来自哪里，点击任何ToolNode都会新开tab，没有breadcrumb，完全扁平的导航结构',
                        badge: 'alternative', 
                        badgeText: '备选'
                    }
                };

                const desc = descriptions[this.currentMode];
                return `
                    <div class="mode-description ${this.currentMode}">
                        <h4>
                            ${desc.title}
                            <span class="mode-badge ${desc.badge}">${desc.badgeText}</span>
                        </h4>
                        <p>${desc.desc}</p>
                    </div>
                `;
            }

            renderBreadcrumb(breadcrumb) {
                return `
                    <div class="breadcrumb">
                        ${breadcrumb.map((item, index) => `
                            <span class="breadcrumb-item ${index === breadcrumb.length - 1 ? 'current' : ''}" 
                                  ${index < breadcrumb.length - 1 ? `onclick="demo.handleBreadcrumbClick(${index})"` : ''}>
                                ${item}
                            </span>
                            ${index < breadcrumb.length - 1 ? '<span class="breadcrumb-separator">></span>' : ''}
                        `).join('')}
                    </div>
                `;
            }

            getContentByType(contentType) {
                const contents = {
                    'main': this.getMainContent(),
                    '主流程': this.getMainContent(),
                    'foreach_parse_bank_statements': this.getForEachParseContent(),
                    'get_latest_bank_statement': this.getLatestBankStatementContent(),
                    'update_assets': this.getUpdateAssetsContent(),
                    'read_doc': this.getReadDocContent(),
                    'parse_bank_statement': this.getParseBankStatementContent(),
                    'item': this.getItemContent(),
                    'output': this.getOutputContent(),
                    'deep_parse_1': this.getDeepParseContent(),
                    'deep_parse_2': this.getDeepParseContent2()
                };

                return contents[contentType] || `<h2>内容：${contentType}</h2><p>这是 ${contentType} 的内容</p>`;
            }

            getMainContent() {
                return `
                    <h2>贷款处理工作流</h2>
                    <p>点击下方的工具节点体验不同的导航模式</p>
                    
                    <div class="workflow-node">
                        <div class="workflow-icon input">📄</div>
                        <div>
                            <h4>获取文档</h4>
                            <p>收集客户提交的贷款申请材料</p>
                        </div>
                    </div>
                    
                    <div class="toolnode-grid">
                        <div class="toolnode" onclick="demo.handleToolNodeClick('foreach_parse_bank_statements', '解析银行流水', 1)">
                            <div class="toolnode-icon">🔧</div>
                            <div class="toolnode-content">
                                <div class="level-indicator">ToolNode</div>
                                <h3>解析银行流水</h3>
                                <p>批量处理和解析银行对账单数据</p>
                            </div>
                        </div>
                        <div class="toolnode" onclick="demo.handleToolNodeClick('get_latest_bank_statement', '获取最新银行流水', 1)">
                            <div class="toolnode-icon">🔧</div>
                            <div class="toolnode-content">
                                <div class="level-indicator">ToolNode</div>
                                <h3>获取最新银行流水</h3>
                                <p>从系统中获取客户最新的银行流水记录</p>
                            </div>
                        </div>
                        <div class="toolnode" onclick="demo.handleToolNodeClick('update_assets', '更新资产信息', 1)">
                            <div class="toolnode-icon">🔧</div>
                            <div class="toolnode-content">
                                <div class="level-indicator">ToolNode</div>
                                <h3>更新资产信息</h3>
                                <p>更新客户的资产和负债信息</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            getForEachParseContent() {
                return `
                    <h2>解析银行流水</h2>
                    <p>批量处理银行对账单，解析交易记录和账户信息</p>
                    
                    <div class="workflow-node">
                        <div class="workflow-icon process">⚙️</div>
                        <div>
                            <h4>处理流程</h4>
                            <p>遍历所有银行流水文件进行解析</p>
                        </div>
                    </div>
                    
                    <div class="toolnode-grid">
                        <div class="toolnode" onclick="demo.handleToolNodeClick('read_doc', '读取文档', 2)">
                            <div class="toolnode-icon">🔧</div>
                            <div class="toolnode-content">
                                <div class="level-indicator">ToolNode</div>
                                <h3>读取文档</h3>
                                <p>读取并解析银行流水PDF文档</p>
                            </div>
                        </div>
                        <div class="toolnode" onclick="demo.handleToolNodeClick('parse_bank_statement', '解析银行对账单', 2)">
                            <div class="toolnode-icon">🔧</div>
                            <div class="toolnode-content">
                                <div class="level-indicator">ToolNode</div>
                                <h3>解析银行对账单</h3>
                                <p>提取交易记录、余额等关键信息</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="workflow-node">
                        <div class="workflow-icon output">📊</div>
                        <div>
                            <h4>输出结果</h4>
                            <p>结构化的银行流水数据</p>
                        </div>
                    </div>
                `;
            }

            getLatestBankStatementContent() {
                return `
                    <h2>获取最新银行流水</h2>
                    <p>从系统数据库中检索客户最新的银行流水记录</p>
                    
                    <div class="workflow-node">
                        <div class="workflow-icon process">🔍</div>
                        <div>
                            <h4>查询过程</h4>
                            <p>根据客户ID和时间范围查询最新记录</p>
                        </div>
                    </div>
                    
                    <div style="padding: 20px; background: #f8f9fa; border-radius: 8px; margin: 20px 0;">
                        <h4>查询参数</h4>
                        <ul style="margin-top: 10px; padding-left: 20px;">
                            <li>客户ID: 唯一标识符</li>
                            <li>时间范围: 最近3个月</li>
                            <li>账户类型: 储蓄/支票账户</li>
                            <li>数据状态: 已验证的记录</li>
                        </ul>
                    </div>
                    
                    <div class="workflow-node">
                        <div class="workflow-icon output">📋</div>
                        <div>
                            <h4>返回数据</h4>
                            <p>最新的银行流水记录列表</p>
                        </div>
                    </div>
                `;
            }

            getUpdateAssetsContent() {
                return `
                    <h2>更新资产信息</h2>
                    <p>根据最新的银行流水和财务数据更新客户资产负债表</p>
                    
                    <div class="workflow-node">
                        <div class="workflow-icon process">💰</div>
                        <div>
                            <h4>更新流程</h4>
                            <p>计算并更新客户的资产和负债信息</p>
                        </div>
                    </div>
                    
                    <div style="padding: 20px; background: #f8f9fa; border-radius: 8px; margin: 20px 0;">
                        <h4>更新内容</h4>
                        <ul style="margin-top: 10px; padding-left: 20px;">
                            <li>银行存款余额</li>
                            <li>投资组合价值</li>
                            <li>房产估值</li>
                            <li>负债总额</li>
                            <li>净资产计算</li>
                        </ul>
                    </div>
                    
                    <div class="workflow-node">
                        <div class="workflow-icon output">📊</div>
                        <div>
                            <h4>更新结果</h4>
                            <p>最新的客户资产负债表</p>
                        </div>
                    </div>
                `;
            }

            getReadDocContent() {
                return `
                    <h2>读取文档</h2>
                    <p>读取和解析银行流水PDF文档，提取文本内容</p>
                    
                    <div class="workflow-node">
                        <div class="workflow-icon process">📖</div>
                        <div>
                            <h4>读取流程</h4>
                            <p>解析PDF文档并提取结构化数据</p>
                        </div>
                    </div>
                    
                    <div class="toolnode-grid">
                        <div class="toolnode" onclick="demo.handleToolNodeClick('deep_parse_1', '解析文档结构', 3)">
                            <div class="toolnode-icon">🔧</div>
                            <div class="toolnode-content">
                                <div class="level-indicator">ToolNode</div>
                                <h3>解析文档结构</h3>
                                <p>识别表格、段落等文档结构</p>
                            </div>
                        </div>
                        <div class="toolnode" onclick="demo.handleToolNodeClick('deep_parse_2', '提取交易数据', 3)">
                            <div class="toolnode-icon">🔧</div>
                            <div class="toolnode-content">
                                <div class="level-indicator">ToolNode</div>
                                <h3>提取交易数据</h3>
